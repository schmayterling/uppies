{{define "main"}}
<h1>status pages</h1>
{{if .Projects}}
<ul class="rows index-list">
  {{range .Projects}}<li><a class="row-link" href="/s/{{.Slug}}"><span>{{.Name}}</span><span class="state state-{{.State}}">{{template "mark" .State}}{{.Word}}</span></a></li>{{end}}
</ul>
{{else}}
<p class="muted">there are no status pages yet. sign in to add a project.</p>
{{end}}
{{end}}

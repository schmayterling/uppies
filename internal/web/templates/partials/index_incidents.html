{{define "index-incidents"}}
<section aria-labelledby="index-incidents-heading">
  <div class="title-row title-ruled">
    <h2 id="index-incidents-heading">recent incidents</h2>
    <a class="meta" href="/incidents">full incident history</a>
  </div>
  {{template "index-incident-timeline" .}}
</section>
{{end}}

{{define "index-incident-timeline"}}
{{if .Days}}
{{template "days" (pair .Days .Zone)}}
{{else}}
<p class="muted">no published incidents to show.</p>
{{end}}
{{end}}

{{define "error"}}<p class="admonition admonition-danger" role="alert">{{template "icon" "circle-x"}}<span>{{.}}</span></p>{{end}}
{{define "warning"}}<p class="admonition admonition-warning">{{template "icon" "info"}}<span>{{.}}</span></p>{{end}}
{{define "info"}}<p class="admonition admonition-info">{{template "icon" "info"}}<span>{{.}}</span></p>{{end}}
{{define "success"}}<p class="admonition admonition-success" role="status">{{template "icon" "circle-check"}}<span>{{.}}</span></p>{{end}}

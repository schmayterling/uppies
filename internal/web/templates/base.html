<!doctype html>
<html lang="en"{{if .Chrome.Admin}} data-density="tool"{{end}}{{with .Chrome.Zone}} data-zone="{{.}}"{{end}}{{if .Chrome.CanonicalURL}} prefix="og: https://ogp.me/ns#"{{end}}>
<head>
{{- template "document-head" . -}}
{{block "head" .}}{{end}}
</head>
{{if .Chrome.Admin -}}
{{template "admin-layout" . -}}
{{else if .Chrome.Auth -}}
{{template "auth-layout" . -}}
{{else}}
<body>
<a class="skip" href="#content">skip to the content</a>
<main class="column" id="content" tabindex="-1">
{{template "main" .}}
</main>
</body>
{{end}}
</html>

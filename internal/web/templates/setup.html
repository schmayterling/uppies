{{define "main"}}
<h1>welcome</h1>
<p class="muted">create the admin account to get started. you only do this once.</p>
<form class="form" method="post" action="/admin/setup">
  {{with .Problem}}{{template "error" .}}{{end}}
  <div class="field">
    <label for="username">username</label>
    <input id="username" name="username" value="{{.Username}}" autocomplete="username" required maxlength="64" autofocus>
  </div>
  <div class="field">
    <label for="password">password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" aria-describedby="password-hint">
    <p class="hint" id="password-hint">at least 10 characters.</p>
  </div>
  <button class="button wide" type="submit">create account</button>
</form>
{{end}}

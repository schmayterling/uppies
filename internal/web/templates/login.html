{{define "main"}}
<h1>sign in</h1>
<p class="muted">to manage your monitors and status pages.</p>
<form class="form" method="post" action="/admin/login">
  {{with .Problem}}{{template "error" .}}{{end}}
  <div class="field">
    <label for="username">username</label>
    <input id="username" name="username" value="{{.Username}}" autocomplete="username" required maxlength="64" autofocus>
  </div>
  <div class="field">
    <label for="password">password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="button wide" type="submit">sign in</button>
</form>
{{end}}

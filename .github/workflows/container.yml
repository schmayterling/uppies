name: Publish container

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/container.yml
      - .dockerignore
      - Dockerfile
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/schmayterling/uppies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish linux/amd64 and linux/arm64 images
        run: |
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:latest" --tag "$IMAGE:sha-$GITHUB_SHA" .
